name: Build Chess Master Pro with Stockfish 18

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download and verify Stockfish 18 binaries
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
          rm -rf /tmp/stockfish /tmp/sf64.tar /tmp/sf32.tar
          curl -fSL -o /tmp/sf64.tar https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-android-armv8.tar
          tar -xf /tmp/sf64.tar -C /tmp
          mv -f /tmp/stockfish/stockfish-android-armv8 app/src/main/jniLibs/arm64-v8a/libstockfish.so
          rm -rf /tmp/stockfish
          curl -fSL -o /tmp/sf32.tar https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-android-armv7.tar
          tar -xf /tmp/sf32.tar -C /tmp
          mv -f /tmp/stockfish/stockfish-android-armv7 app/src/main/jniLibs/armeabi-v7a/libstockfish.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libstockfish.so app/src/main/jniLibs/armeabi-v7a/libstockfish.so
          echo "=== ARM64 binary ==="
          file app/src/main/jniLibs/arm64-v8a/libstockfish.so
          echo "=== ARMv7 binary ==="
          file app/src/main/jniLibs/armeabi-v7a/libstockfish.so

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Keystore
        run: |
          keytool -genkeypair -keystore release.jks -alias upload -keyalg RSA -keysize 2048 -storepass android123 -keypass android123 -dname "CN=ChessMasterPro" -validity 10000
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.jks" >> $GITHUB_ENV
          echo "STORE_PASSWORD=android123" >> $GITHUB_ENV
          echo "KEY_PASSWORD=android123" >> $GITHUB_ENV

      - name: Build Debug APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build Release APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: List generated APKs
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -print -exec ls -lh {} \;

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: ChessMasterPro-Debug-APKs
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: ChessMasterPro-Release-APKs
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
