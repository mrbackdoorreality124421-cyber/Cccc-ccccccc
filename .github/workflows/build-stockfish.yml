name: Build Chess Master Pro with Stockfish 18

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pre-bundle Stockfish 18 Binaries
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
          
          if [ ! -f app/src/main/jniLibs/arm64-v8a/libstockfish.so ]; then
            echo "Downloading ARM64 Stockfish..."
            curl -fSL -o /tmp/sf64.tar https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-android-armv8.tar
            tar -xf /tmp/sf64.tar -C /tmp
            mv /tmp/stockfish/stockfish-android-armv8 app/src/main/jniLibs/arm64-v8a/libstockfish.so
          fi
          
          if [ ! -f app/src/main/jniLibs/armeabi-v7a/libstockfish.so ]; then
            echo "Downloading ARMv7 Stockfish..."
            curl -fSL -o /tmp/sf32.tar https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-android-armv7.tar
            tar -xf /tmp/sf32.tar -C /tmp
            mv /tmp/stockfish/stockfish-android-armv7 app/src/main/jniLibs/armeabi-v7a/libstockfish.so
          fi
          
          chmod +x app/src/main/jniLibs/arm64-v8a/libstockfish.so
          chmod +x app/src/main/jniLibs/armeabi-v7a/libstockfish.so
          ls -la app/src/main/jniLibs/arm64-v8a/
          ls -la app/src/main/jniLibs/armeabi-v7a/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Keystore
        run: |
          keytool -genkeypair -keystore release.jks -alias upload -storepass android123 -keypass android123 -dname "CN=ChessMasterPro" -validity 10000
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.jks" >> $GITHUB_ENV
          echo "STORE_PASSWORD=android123" >> $GITHUB_ENV
          echo "KEY_PASSWORD=android123" >> $GITHUB_ENV

      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessMasterPro-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessMasterPro-Release-APK
          path: app/build/outputs/apk/release/*.apk
