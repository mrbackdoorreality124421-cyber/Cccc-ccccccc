name: Build Chess Master Pro with Stockfish 18

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Download Stockfish 18 Binaries
      run: |
        mkdir -p app/src/main/jniLibs/arm64-v8a
        mkdir -p app/src/main/jniLibs/armeabi-v7a
        mkdir -p app/src/main/jniLibs/x86_64

        wget -q "https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-android-armv8.tar" -O /tmp/stockfish-arm64.tar || true
        wget -q "https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-android-armv7.tar" -O /tmp/stockfish-armv7.tar || true
        wget -q "https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-android-x86_64.tar" -O /tmp/stockfish-x86_64.tar || true

    - name: Extract Stockfish Binaries
      run: |
        if [ -f /tmp/stockfish-arm64.tar ]; then
          tar -xf /tmp/stockfish-arm64.tar -C /tmp/
          find /tmp/stockfish* -name "stockfish" -type f -exec cp {} app/src/main/jniLibs/arm64-v8a/libstockfish.so \; || true
        fi

        if [ -f /tmp/stockfish-armv7.tar ]; then
          tar -xf /tmp/stockfish-armv7.tar -C /tmp/
          find /tmp/stockfish* -name "stockfish" -type f -exec cp {} app/src/main/jniLibs/armeabi-v7a/libstockfish.so \; || true
        fi

        if [ -f /tmp/stockfish-x86_64.tar ]; then
          tar -xf /tmp/stockfish-x86_64.tar -C /tmp/
          find /tmp/stockfish* -name "stockfish" -type f -exec cp {} app/src/main/jniLibs/x86_64/libstockfish.so \; || true
        fi

        chmod +x app/src/main/jniLibs/*/libstockfish.so 2>/dev/null || true

        echo "=== VERIFICATION ==="
        ls -la app/src/main/jniLibs/arm64-v8a/ || true
        ls -la app/src/main/jniLibs/armeabi-v7a/ || true
        ls -la app/src/main/jniLibs/x86_64/ || true

    - name: Grant Gradle Permission
      run: chmod +x gradlew || true

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
