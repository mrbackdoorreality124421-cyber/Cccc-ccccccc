name: Build Chess Master Pro with Stockfish 18

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Setup JDK 17
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Step 3: Setup Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # Step 4: Cache Gradle
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    # Step 5: Download Stockfish 18 Binaries (WITH REDIRECT FOLLOW)
    - name: Download Stockfish 18 Binaries
      run: |
        echo "=== Creating jniLibs directories ==="
        mkdir -p app/src/main/jniLibs/arm64-v8a
        mkdir -p app/src/main/jniLibs/armeabi-v7a
        mkdir -p app/src/main/jniLibs/x86_64

        echo "=== Downloading Stockfish 18 ARM64 (with redirect follow) ==="
        wget --max-redirect=10 --progress=dot:giga -O /tmp/stockfish-arm64.tar "https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-android-armv8.tar"

        echo "=== Downloading Stockfish 18 ARMv7 (with redirect follow) ==="
        wget --max-redirect=10 --progress=dot:giga -O /tmp/stockfish-armv7.tar "https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-android-armv7.tar"

        echo "=== Downloading Stockfish 18 x86_64 (with redirect follow) ==="
        wget --max-redirect=10 --progress=dot:giga -O /tmp/stockfish-x86_64.tar "https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-android-x86_64.tar"

        echo "=== Verifying downloaded files ==="
        ls -lah /tmp/stockfish-*.tar
        file /tmp/stockfish-*.tar

    # Step 6: Extract and Rename Binaries (with error handling)
    - name: Extract Stockfish Binaries
      run: |
        set -e

        echo "=== Extracting ARM64 ==="
        if file /tmp/stockfish-arm64.tar | grep -q "tar archive"; then
          tar -xf /tmp/stockfish-arm64.tar -C /tmp/
          find /tmp -name "stockfish" -type f 2>/dev/null | head -5
          find /tmp -name "stockfish" -type f -exec cp {} app/src/main/jniLibs/arm64-v8a/libstockfish.so \;
        else
          echo "ERROR: ARM64 file is not a tar archive!"
          file /tmp/stockfish-arm64.tar
          head -c 200 /tmp/stockfish-arm64.tar
          exit 1
        fi

        echo "=== Extracting ARMv7 ==="
        if file /tmp/stockfish-armv7.tar | grep -q "tar archive"; then
          tar -xf /tmp/stockfish-armv7.tar -C /tmp/
          find /tmp -name "stockfish" -type f 2>/dev/null | head -5
          find /tmp -name "stockfish" -type f -exec cp {} app/src/main/jniLibs/armeabi-v7a/libstockfish.so \;
        else
          echo "ERROR: ARMv7 file is not a tar archive!"
          file /tmp/stockfish-armv7.tar
          head -c 200 /tmp/stockfish-armv7.tar
          exit 1
        fi

        echo "=== Extracting x86_64 ==="
        if file /tmp/stockfish-x86_64.tar | grep -q "tar archive"; then
          tar -xf /tmp/stockfish-x86_64.tar -C /tmp/
          find /tmp -name "stockfish" -type f 2>/dev/null | head -5
          find /tmp -name "stockfish" -type f -exec cp {} app/src/main/jniLibs/x86_64/libstockfish.so \;
        else
          echo "ERROR: x86_64 file is not a tar archive!"
          file /tmp/stockfish-x86_64.tar
          head -c 200 /tmp/stockfish-x86_64.tar
          exit 1
        fi

        echo "=== Setting executable permissions ==="
        chmod +x app/src/main/jniLibs/*/libstockfish.so

        echo "=== FINAL VERIFICATION ==="
        echo "--- ARM64 ---"
        ls -la app/src/main/jniLibs/arm64-v8a/
        file app/src/main/jniLibs/arm64-v8a/libstockfish.so

        echo "--- ARMv7 ---"
        ls -la app/src/main/jniLibs/armeabi-v7a/
        file app/src/main/jniLibs/armeabi-v7a/libstockfish.so

        echo "--- x86_64 ---"
        ls -la app/src/main/jniLibs/x86_64/
        file app/src/main/jniLibs/x86_64/libstockfish.so

    # Step 7: Grant Gradle execute permission
    - name: Grant Gradle Permission
      run: chmod +x gradlew

    # Step 8: Build Debug APK
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    # Step 9: Build Release APK
    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace

    # Step 10: Upload Debug APK
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    # Step 11: Upload Release APK
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
